<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>興儒私中班</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%223%22 y=%224%22 width=%2221%22 height=%2225%22 rx=%224%22 fill=%22%23fff%22 stroke=%22%230d7f86%22 stroke-width=%222.5%22/%3E%3Crect x=%2223%22 y=%227%22 width=%226%22 height=%225%22 rx=%221.5%22 fill=%22%23b4462f%22/%3E%3Crect x=%2223%22 y=%2214%22 width=%226%22 height=%225%22 rx=%221.5%22 fill=%22%230d7f86%22/%3E%3Crect x=%2223%22 y=%2221%22 width=%226%22 height=%225%22 rx=%221.5%22 fill=%22%232f62c9%22/%3E%3Cpath d=%22M8 17l3 3 6-7%22 fill=%22none%22 stroke=%22%23e5534b%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap">
<style>
/* Layout: 貼紙卡片風格。左邊是依週分組的單元清單（週考分頁時換成考試日期），右邊依分頁顯示講義題目、重點複習、週考解析、隨機測驗、錯題本。三科各有一個標示色：國文磚紅、英文青綠、數學藍。 */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.7;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 2px, transparent 2px);
  background-size: 26px 26px;
}
button, select, input { font-family: inherit; }
.wrap { max-width: 1220px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 72px; display: grid; gap: 22px; }

/* 頁首 */
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 54px; height: 54px; flex: none; }
.brand h1 { font-size: 2.1rem; margin: 0; line-height: 1.1; letter-spacing: .06em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: 0 4px 0 var(--line); }
.tab { font-size: 1.05rem; border: 0; border-radius: 999px; padding: 8px 18px; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tab-count { font-size: .8rem; font-variant-numeric: tabular-nums; background: var(--red); color: #fff; border-radius: 999px; padding: 0 8px; line-height: 1.6; }
.tab-count:empty { display: none; }
.head-right { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; }
/* 額外學習內容：和分頁分開的貼紙按鈕 */
.extra-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 1.02rem; color: #4a3500; background: var(--sun); border: 2px solid color-mix(in srgb, var(--sun) 70%, #000); border-radius: 999px; padding: 8px 16px; text-decoration: none; box-shadow: 0 4px 0 color-mix(in srgb, var(--sun) 55%, #000); white-space: nowrap; }
.extra-btn svg { width: 20px; height: 20px; flex: none; }
.extra-btn small { font-size: .75rem; opacity: .8; }
.extra-btn:hover { filter: brightness(1.04); }
.extra-btn:active { transform: translateY(3px); box-shadow: none; }
.extra-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; gap: 22px; align-items: start; }
@media (min-width: 960px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 6px; }
}
.side { display: grid; gap: 16px; min-width: 0; align-content: start; }

/* 共用卡片 */
.box, .sheet-head, .panel, .q, .passage, .progress, .empty, .note-card {
  background: var(--paper); border: 2px solid var(--line); border-radius: var(--r-card); box-shadow: 0 5px 0 var(--line);
}

/* 科目色 */
.subj { display: inline-grid; place-items: center; flex: none; min-width: 2.6em; font-size: .8rem; line-height: 1.6; border-radius: 999px; padding: 0 8px; color: var(--paper); background: var(--sc, var(--accent)); }
.s-zh { --sc: var(--zh); --sc-soft: var(--zh-soft); }
.s-en { --sc: var(--en); --sc-soft: var(--en-soft); }
.s-math { --sc: var(--math); --sc-soft: var(--math-soft); }
.s-mixed { --sc: var(--mixed); --sc-soft: var(--mixed-soft); }

/* 側欄 */
.box { padding: 16px 12px 14px 16px; display: grid; gap: 10px; justify-items: stretch; }
.box-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-right: 4px; }
.box h2 { font-size: 1.3rem; margin: 0; }
.unit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.week-label { font-size: .85rem; color: var(--muted); padding: 4px 4px 0; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.unit-empty { color: var(--muted); font-size: .92rem; padding: 4px 0; }
.unit-item { border-radius: 16px; border: 2px solid transparent; background: var(--bg); }
.unit-item:hover { border-color: var(--line); }
.unit-item.active { background: var(--sc-soft); border-color: var(--sc); }
.unit-open { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 9px 12px; cursor: pointer; display: grid; gap: 3px; min-width: 0; border-radius: 14px; }
.u-top { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.u-title { font-size: .98rem; line-height: 1.4; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; min-width: 0; }
.u-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .78rem; border-radius: 999px; padding: 0 10px; line-height: 1.7; border: 2px solid var(--line); color: var(--muted); background: var(--paper); white-space: nowrap; }
.pill.run { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pill.err { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.pill.warn { border-color: var(--sun); color: var(--amber); background: var(--sun-soft); }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
.side-link { color: var(--accent); overflow-wrap: anywhere; font-size: .92rem; }
.kind-filter .chip { padding: 3px 12px; font-size: .88rem; }
.chips.tall { max-height: 13.5em; overflow-y: auto; padding: 2px; }
/* 檢討影片：一顆一顆的連結，前面的紅色三角形表示會開影片 */
.video-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 18px 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; font-size: .98rem; line-height: 1.3; }
.video-link::before { content: ""; flex: none; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent var(--red); }
.video-link:hover { border-color: var(--red); background: var(--red-soft); }
.video-day { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 6px 14px; align-items: start; }
.video-day time { color: var(--muted); font-variant-numeric: tabular-nums; line-height: 44px; white-space: nowrap; }
.video-links { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.speed-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.voice-select { font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; width: 100%; min-width: 0; }
.folder-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.folder-list li { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: .9rem; background: var(--bg); border-radius: 12px; padding: 4px 6px 4px 10px; min-width: 0; }
.folder-list a { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.add-row { display: flex; gap: 6px; }
.add-row input { flex: 1; min-width: 0; font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; }
.add-row input:focus { outline: 3px solid var(--sun); outline-offset: 0; }
.x-btn { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 6px; border-radius: 8px; }
.x-btn:hover { color: var(--red); background: var(--red-soft); }

/* 按鈕 */
.btn { font-size: 1rem; border-radius: var(--r-btn); border: 2px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.good { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.btn.bad { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.btn.big { font-size: 1.2rem; padding: 10px 28px; border-radius: 18px; }
.btn.small { padding: 4px 12px; font-size: .9rem; border-radius: 12px; }
.btn.armed { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .tab:focus-visible, .unit-open:focus-visible, .spk:focus-visible, .x-btn:focus-visible,
.link-btn:focus-visible, .master-btn:focus-visible, .flash-card:focus-visible, .star-btn:focus-visible, .play-big:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* 發音按鈕 */
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); color: var(--accent); cursor: pointer; padding: 0; display: inline-grid; place-items: center; vertical-align: middle; }
.spk:hover { border-color: var(--accent); background: var(--accent-soft); }
.spk svg { width: 18px; height: 18px; }
.spk.sm { width: 28px; height: 28px; }
.spk.sm svg { width: 15px; height: 15px; }
.spk.speaking { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); } }

/* 數學分數 */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.15; margin: 0 .12em; font-variant-numeric: tabular-nums; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }

/* 進度與提醒 */
.result { display: grid; gap: 18px; min-width: 0; }
.progress { display: grid; gap: 8px; padding: 18px 22px; }
.progress strong { font-size: 1.15rem; font-weight: 400; }
.bar { height: 14px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 2px solid var(--line); }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--accent) 0 12px, color-mix(in srgb, var(--accent) 80%, #fff) 12px 24px); border-radius: inherit; transition: width .4s; }
.bar.indeterminate i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.notice { font-size: .95rem; border-radius: 16px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--sun-soft); border: 2px solid var(--sun); }
.notice.err { background: var(--red-soft); border-color: var(--red); color: var(--red); }

/* 抬頭 */
.sheet-head { padding: 20px 22px; display: grid; gap: 14px; }
.titles { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 20px; align-items: center; }
.title-block { display: grid; gap: 4px; min-width: 0; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sheet-head h2 { font-size: 1.55rem; margin: 0; line-height: 1.35; font-weight: 400; text-wrap: balance; }
.meta { color: var(--muted); font-size: .92rem; }
.score { display: grid; justify-items: center; background: var(--sun-soft); border: 2px solid var(--sun); border-radius: 18px; padding: 6px 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score b { font-size: 2.1rem; font-weight: 400; color: var(--ink); }
.score small { font-size: .85rem; color: var(--muted); }
.stars { font-size: 1.1rem; letter-spacing: 2px; color: var(--sun); }
.stars .off { color: var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .95rem; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--muted); padding: 5px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip small { font-variant-numeric: tabular-nums; opacity: .8; }
.chip .subj { font-size: .72rem; min-width: 0; }
.head-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.head-links { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-width: 0; }
details > summary { cursor: pointer; color: var(--accent); width: fit-content; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
.photo-grid a { display: block; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.photo-grid img { display: block; width: 100%; height: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.switch { display: flex; gap: 8px; align-items: center; font-size: .95rem; cursor: pointer; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 10px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }

/* 題組文章與大題 */
.questions { display: grid; gap: 16px; }
.section-title { font-size: 1.2rem; font-weight: 400; margin: 10px 0 0; display: flex; align-items: center; gap: 10px; color: var(--ink); scroll-margin-top: 16px; }
.section-title::before { content: ""; width: 10px; height: 26px; border-radius: 6px; background: var(--sun); flex: none; }
.passage { padding: 16px 22px; background: var(--sun-soft); border-color: var(--sun); box-shadow: 0 5px 0 color-mix(in srgb, var(--sun) 55%, var(--line)); }
.passage-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; }
.passage-text { font-family: var(--font-en); font-size: 1.05rem; white-space: pre-wrap; line-height: 1.85; margin-top: 8px; max-width: 80ch; overflow-wrap: anywhere; }
.passage-text.table { overflow-x: auto; white-space: pre; font-variant-numeric: tabular-nums; }
.q .passage { box-shadow: none; padding: 8px 14px; border-radius: 14px; }

/* 題目卡 */
.q { padding: 18px 22px 20px; display: grid; gap: 12px; scroll-margin-top: 16px; min-width: 0; }
.q.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 5px var(--sun); } to { box-shadow: 0 5px 0 var(--line); } }
.q-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.q-origin { font-size: .85rem; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 2px 12px; }
.cat { font-size: .8rem; border-radius: 999px; padding: 1px 10px; border: 2px solid; }
.cat.c0 { color: var(--amber); border-color: var(--sun); background: var(--sun-soft); }
.cat.c1 { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.cat.c2 { color: var(--green); border-color: var(--green); background: var(--green-soft); }
.cat.listen { color: var(--violet); border-color: var(--violet); background: var(--violet-soft); }
.q-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.num { font-family: var(--font-en); font-size: 1.05rem; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 0 8px; font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; }
.stem { font-family: var(--font-en); font-size: 1.15rem; line-height: 1.75; overflow-wrap: anywhere; white-space: pre-wrap; }
.blank { display: inline-block; min-width: 4.4em; border-bottom: 2.5px dashed var(--accent); margin: 0 4px; height: 1.1em; vertical-align: -2px; text-align: center; font-size: .8em; color: var(--muted); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; padding: 0; margin: 0; list-style: none; }
.opt { font-family: var(--font-en); font-size: 1.05rem; border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; display: flex; gap: 8px; align-items: baseline; background: var(--paper); color: var(--ink); text-align: left; width: 100%; }
.opt .lab { color: var(--muted); }
.opt .tag { margin-left: auto; font-family: var(--font-ui); font-size: .8rem; white-space: nowrap; border-radius: 999px; padding: 0 8px; }
.opt.is-answer { border-color: var(--green); background: var(--green-soft); }
.opt.is-answer .lab { color: var(--green); }
.opt.is-answer .tag { background: var(--green); color: #fff; }
.opt.is-picked { border-color: var(--red); background: var(--red-soft); }
.opt.is-picked .txt { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.opt.is-picked .lab { color: var(--red); }
.opt.is-picked .tag { background: var(--red); color: #fff; }
.free-answer { font-family: var(--font-en); border: 2px solid var(--green); padding: 6px 14px; background: var(--green-soft); border-radius: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; white-space: pre-wrap; }
.completed { font-family: var(--font-en); font-size: 1.05rem; padding: 10px 14px; border-radius: 14px; background: var(--bg); overflow-wrap: anywhere; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.completed mark { background: var(--sun-soft); color: var(--green); border-radius: 6px; padding: 0 4px; border-bottom: 2.5px solid var(--green); }
.explain { display: grid; gap: 8px; }
.kp-chip { justify-self: start; font-size: .88rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 12px; }
.explain p { margin: 0; max-width: 70ch; white-space: pre-wrap; }
.explain .steps { font-variant-numeric: tabular-nums; line-height: 2; }
.handout { font-size: .95rem; border-left: 4px solid var(--sun); padding: 4px 12px; background: var(--bg); border-radius: 0 12px 12px 0; white-space: pre-wrap; font-variant-numeric: tabular-nums; line-height: 1.9; }
.handout b { font-weight: 400; color: var(--amber); display: block; font-size: .85rem; }
.why-not { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .95rem; color: var(--muted); }
.why-not b { color: var(--ink); font-weight: 400; font-family: var(--font-en); margin-right: 6px; }
.teacher-note { justify-self: start; font-size: .88rem; color: var(--amber); background: var(--sun-soft); border: 2px dashed var(--sun); border-radius: 12px; padding: 2px 12px; }
.master-btn { justify-self: start; font-size: 1rem; border-radius: 999px; border: 2px solid var(--sun); background: var(--paper); color: var(--amber); padding: 5px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--sun); }
.master-btn:active { transform: translateY(3px); box-shadow: none; }
.master-btn[aria-pressed="true"] { background: var(--sun); color: #5a3d00; }
.q.is-mastered { border-color: var(--sun); box-shadow: 0 5px 0 var(--sun); }
.wrong-count { font-size: .85rem; color: var(--red); }

/* 挑戰模式：先遮住答案 */
.q.hide-ans .explain, .q.hide-ans .completed, .q.hide-ans .free-answer, .q.hide-ans .opt .tag, .q.hide-ans .redpen, .q.hide-ans .stu, .q.hide-ans .master-btn { visibility: hidden; }
.q.hide-ans .opt .txt { text-decoration: none; }
.q.hide-ans .free-answer, .q.hide-ans .explain { display: none; }
.q.hide-ans .opt { border-color: var(--line); background: var(--paper); cursor: pointer; }
.q.hide-ans .opt .lab { color: var(--muted); }
.q.hide-ans .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.reveal-btn { display: none; }

@media (prefers-reduced-motion: reduce) { .q.flash, .bar.indeterminate i, .spk.speaking, .play-big.speaking { animation: none; } * { transition: none !important; } }
@media (max-width: 560px) {

<script type="text/plain" id="app-main">
const $ = s => document.querySelector(s);
const brandIcon = window.uiIcon('book-2'); if (brandIcon) { brandIcon.classList.add('logo'); $('.brand .logo').replaceWith(brandIcon); }
const topIcon = window.uiIcon('arrow-up'); if (topIcon) $('#back-to-top span').replaceWith(topIcon);
for (const [id, icon] of Object.entries({sets:'book-2',notes:'notes',exams:'file-text',videos:'player-play',quiz:'arrows-shuffle',wrong:'bookmark',extra:'school'})) {
  const node = window.uiIcon(icon); if (node) $('#tab-' + id).prepend(node);
}
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const enc = encodeURIComponent;
const norm = v => String(v ?? "").replace(/[()（）\s.]/g, "").toUpperCase();
const fmtDate = iso => { const d = new Date(iso); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SHARE = window.__CLASS_SHARE__ || { units: [], exams: [], videos: [] };
const PREFIX = "class-share:";
/* ---------- 科目設定 ---------- */
const SUBJECTS = {
  zh: { name: "國文", lang: "zh-TW", cats: { reading: "閱讀", words: "字詞", knowledge: "語文常識" }, vocab: "字詞表", sample: "春聯貼門上，福氣滿堂來。" },
  en: { name: "英文", lang: "en-US", cats: { reading: "閱讀", grammar: "文法", vocab: "單字" }, vocab: "單字表", listen: true, sample: "Let's learn English." },
  math: { name: "數學", lang: null, cats: { concept: "觀念", calc: "計算", word: "應用題" }, vocab: "名詞解釋", math: true },
  mixed: { name: "週考卷", lang: null, cats: { zh: "國", en: "英", math: "數" }, vocab: "" }
};
const subjOf = name => state.units.find(u => u.name === name)?.subject || state.detail[name]?.subject || "en";
const S = name => SUBJECTS[subjOf(name)] || SUBJECTS.en;
function catLabel(cat) {
  if (cat === "listen") return "聽力";
  for (const s of Object.values(SUBJECTS)) if (s.cats[cat]) return s.cats[cat];
  return cat;
}
function catChip(cat, subject) {
  const keys = Object.keys(SUBJECTS[subject]?.cats || {});
  return el("span", "cat " + (cat === "listen" ? "listen" : "c" + Math.max(0, keys.indexOf(cat))), catLabel(cat));
}
const subjectShort = subject => ({zh:"國",en:"英",math:"數",mixed:"綜"})[subject] || "";
const compactNumber = n => {
  if (/^\d+$/.test(n)) return n;
  const digits = {一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  if (n.includes("十")) { const [a,b] = n.split("十"); return (digits[a] || 1)*10+(digits[b] || 0); }
  return digits[n] || n;
};
const compactTitle = text => String(text || "").replace(/^(國文|英文|數學|國語|英語)(?:科)?[：:\s]*/, "").replace(/Unit\s*(\d+)/gi, "U$1").replace(/第\s*([0-9一二三四五六七八九十]+)\s*(單元|回|週|章)/g, (_,n,k)=>`${compactNumber(n)}${k}`);
const sectionLabel = text => String(text || "").replace(/[（(]每題[^）)]*[）)]/g, "").replace(/[：:]\s*$/, "").trim();
const subjBadge = (subject, text) => {
  const badge = el("span", `subj s-${subject}`, text ?? subjectShort(subject));
  badge.title = SUBJECTS[subject]?.name || "";
  return badge;
};
const detectSubject = t => (/國文|國語|中文/.test(t) ? "zh" : /英文|英語|english/i.test(t) ? "en" : /數學|math/i.test(t) ? "math" : null);
// 額外學習：每一項是一個模組，window[module] 提供 render(root, ctx)，可選 controls(box, ctx) 畫左側控制列、leave() 在換走時收拾。
// styles／scripts 在第一次打開時依序載入；block 表示內容自己排版（右側不套用卡片間距）。
const MATH_LESSONS = ["basic", "calculus", "linear", "engineering", "llm-inference", "llm-training", "bridges", "probability-advanced", "advanced-calculus", "structures"];
const EXTRA_LESSONS = [
  { id: "tense", name: "時態樂園", description: "看圖認識時態，試試互動練習。", module: "TensePark", block: true,
    styles: ["extra/tense/tense.css"], scripts: ["extra/tense/curriculum-extra.js", "extra/tense/tense.js"] },
  { id: "verb-forms", name: "動詞三態", description: "國中小常用動詞，查三態、聽發音、練習填寫。", module: "VerbForms",
    styles: ["extra/verb-forms.css"], scripts: ["extra/verb-forms.js"] },
  { id: "grammar-prep", name: "私中英文文法", description: "振聲／新興備考：問句、頻率、比較級與介系詞。", module: "GrammarPrep",
    styles: ["extra/grammar-prep.css"], scripts: ["extra/grammar-prep-data.js", "extra/grammar-prep.js"] },
  { id: "math-playground", name: "數學遊樂場", subject: "math", description: "66 個互動案例，從生活探索數學與 AI。", module: "MathPlayground", block: true,
    styles: ["extra/math-playground/math-playground.css"],
    scripts: ["extra/math-playground/js/core.js", ...MATH_LESSONS.map(name => `extra/math-playground/lessons/${name}.js`), "extra/math-playground/js/curriculum.js", "extra/math-playground/math-playground.js"] }
];
const examSubject = e => detectSubject(`${e.subject} ${e.title}`) || "mixed";
// 同一天同一科有兩份時靠這個分辨（單字卷、語感練習）
const examTag = e => (/單字/.test(e.title) ? "單字" : /語感/.test(e.title) ? "語感" : "");
const examScope = e => [examTag(e), compactTitle(e.scope)].filter(Boolean).join(" ") || compactTitle(e.title) || "考卷";
const examName = e => `${subjectShort(examSubject(e))} ${examScope(e)}`;

/* ---------- 只存在這台裝置的紀錄（錯題、熟記字詞、測驗成績、設定） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch {} }
};
let wrongBook = store.get("wrong", {});        // id -> { n, at, done }
// 1003 舊週考併入分科目錄（0 英文週考、1 英文單字卷、2 國文週考），保留這台裝置的錯題與上次選擇。
const MOVED_1003 = { "0": "英文/0", "1": "英文/1", "2": "國文/0" };
const moved1003 = id => id.replace(/^exam:1003\/([012])(?=-|$)/, (_, ei) => "exam:1003/" + MOVED_1003[ei]);
for (const id of Object.keys(wrongBook)) {
  const to = moved1003(id);
  if (to !== id) { wrongBook[to] = wrongBook[id]; delete wrongBook[id]; }

function richText(text, subject) {
  const s = String(text ?? "");
  if (subject !== "math" && subject !== "mixed") return document.createTextNode(s);
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of s.matchAll(/(\d+)又(\d+)\/(\d+)|(?<![\w./])(\d+)\/(\d+)(?![\w/])/g)) {
    if (m.index > last) frag.append(s.slice(last, m.index));
    const whole = m[1], top = m[2] ?? m[4], bottom = m[3] ?? m[5];
    if (whole) frag.append(whole);
    const f = el("span", "frac"); f.setAttribute("aria-label", `${whole ? whole + "又" : ""}${bottom}分之${top}`);
    f.append(el("span", null, top), el("span", null, bottom));
    frag.append(f);
    last = m.index + m[0].length;
  }
  frag.append(s.slice(last));
  return frag;
}
function textEl(tag, cls, text, subject) { const n = el(tag, cls); n.append(richText(text, subject)); return n; }

// 對錯判定：學生作答和正解比較
function verdict(q) {
  if (q.studentAnswer == null || !q.answer) return "none";
    if (!q.options?.length) {
    const student = String(q.studentAnswer).trim(), answer = String(q.answer).trim();
    if (!/^-?\d+(?:\.\d+)?$/.test(student) || !/^-?\d+(?:\.\d+)?$/.test(answer)) return "none";
    return Number(student) === Number(answer) ? "ok" : "bad";
  }
  const normalize = v => q.multiple ? String(v).split(/[、,，]/).map(norm).sort().join(",") : norm(v);
  return normalize(q.studentAnswer) === normalize(q.answer) ? "ok" : "bad";
}
function examSummary(a) {
  let count = 0, answered = 0, wrong = 0;
  const exams = a.exams.map(e => {
    const vs = e.questions.map(verdict);
    count += vs.length; answered += vs.filter(v => v !== "none").length; wrong += vs.filter(v => v === "bad").length;
    return { subject: examSubject(e), name: examName(e), count: vs.length, answered: vs.filter(v => v !== "none").length, right: vs.filter(v => v === "ok").length };
  });
  return { exams, count, answered, right: answered - wrong, wrong };
}

function listenItems(d) {
  const v = d.data.vocab || [];
  if (v.length < 4) return [];
  return v.map((w, i) => {
    const base = baseWord(w.word), byMeaning = i % 2 === 1;
    const candidates = v.filter((x, j) => j !== i && baseWord(x.word).toLowerCase() !== base.toLowerCase() && x.zh !== w.zh);
    const unique = new Map(candidates.map(x => [String(byMeaning ? x.zh : baseWord(x.word)).trim().toLowerCase(), x]));
    const others = shuffle([...unique.values()]).slice(0, 3);
    if (!others.length) return null;
    const choices = shuffle([w, ...others]);
    const answer = "ABCD"[choices.indexOf(w)];
    return {
      id: `${d.name}/w${i}`, unit: d.name, subject: d.subject, key: `w${i}`, num: String(i + 1), passage: null, origin: "單字發音", source: "listen",
      q: {

        options: choices.map((c, k) => ({ label: "ABCD"[k], text: byMeaning ? c.zh : baseWord(c.word) })), answer,
        keyPoint: `${base}　${w.pos}　${w.zh}`, explanation: w.example ? `${w.example}（${w.exampleZh || ""}）` : "", optionNotes: [], completed: ""

}

const extraLoads = {};
function loadExtra(lesson) {
  if (extraLoads[lesson.id]) return extraLoads[lesson.id];
  const load = (tag, attrs) => new Promise((resolve, reject) => {
    const node = Object.assign(document.createElement(tag), attrs);
    node.onload = resolve;
    node.onerror = () => reject(new Error("載入失敗：" + (attrs.src || attrs.href)));
    (tag === "link" ? document.head : document.body).append(node);
  });
  const styles = Promise.all((lesson.styles || []).map(href => load("link", { rel: "stylesheet", href })));
  const scripts = (lesson.scripts || []).reduce((done, src) => done.then(() => load("script", { src, async: false })), Promise.resolve());
  const task = extraLoads[lesson.id] = Promise.all([styles, scripts]).then(() => { task.ready = true; });
  task.catch(() => { delete extraLoads[lesson.id]; });

}

/* ---------- 隨機測驗 ---------- */
// 範圍裡的週考：exam:<日期/科目>/<第幾份考卷>
function examScopes() {
  return state.exams.flatMap(f => (state.examDetail[f.name]?.analysis?.exams || []).map((e, ei) => ({ id: `exam:${f.name}/${ei}`, folder: f.name, ei, kind: f.kind, short: `${f.label}${examTag(e)} ${e.scope || e.title || ""}`.trim(), label: `${f.kind} ${f.label} ${examName(e)}`, subject: examSubject(e) })));
}
function quizPool(cfg) {
  const out = [];
  for (const name of cfg.units) {
    if (name.startsWith("exam:")) {
      const folder = name.slice(5, name.lastIndexOf("/"));
      const ei = name.slice(name.lastIndexOf("/") + 1);
      for (const it of examItems(state.examDetail[folder])) {
        if (it.exam !== Number(ei) || cfg.offCats.includes(it.q.category)) continue;
        if (isChoice(it.q) || (cfg.free && isFree(it.q))) out.push(it);
      }
      continue;
    }
    const d = state.detail[name];
    if (!d?.data) continue;
    for (const it of unitItems(d)) {
      if (cfg.offCats.includes(it.q.category)) continue;
      if (!isChoice(it.q) && !(cfg.free && isFree(it.q))) continue;
      if (cfg.source === "orig" && it.source !== "orig") continue;
      if (cfg.source === "new" && it.source !== "new") continue;
      out.push(it);
    }
    if (!cfg.offCats.includes("listen")) out.push(...d.listen);
  }
  return out;
}
// 同一篇文章的題目放在一起出；可選擇錯過的題目優先
function quizGroupKey(it) {
  if (!it.passage) return it.id;
  const scope = it.unit ? ['unit', it.unit, it.source, it.source === 'orig' ? it.set : null] : ['exam', it.folder, it.exam];
  return JSON.stringify([...scope, it.passage.id]);
}
function pickQuiz(pool, count, wrongFirst) {
  const groups = new Map();
  for (const it of new Map(pool.map(it => [it.id, it])).values()) {
    const g = quizGroupKey(it);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  let list = shuffle([...groups.values()]);
  if (wrongFirst) {
    const hasWrong = g => g.some(it => wrongBook[it.id] && !wrongBook[it.id].done);
    list = [...list.filter(hasWrong), ...list.filter(g => !hasWrong(g))];
  }

  for (const g of list) { if (out.length >= count) break; out.push(...g); }
  return out;
}

const ICON_PLAY = SPK_ICON;
function renderQuizRunner(root) {
  const z = state.quiz, it = z.items[z.i], q = it.q, subject = it.subject, lang = SUBJECTS[subject]?.lang;
  const picked = z.picks[z.i];
  const right = z.picks.filter(p => p?.ok).length;
  const free = !isChoice(q);

  const head = el("div", "progress runner-head");
  const top = el("div", "runner-top");
  top.append(el("b", null, `第 ${z.i + 1} / ${z.items.length} 題`), el("span", "runner-score", `答對 ${right} 題`));
  top.append(confirmButton("結束測驗", "確定結束？", () => { state.quiz = null; render(); }));
  const bar = el("div", "bar"); const bi = el("i"); bi.style.width = `${Math.round(((z.i + (picked ? 1 : 0)) / z.items.length) * 100)}%`; bar.append(bi);
  head.append(top, bar);

  const card = el("article", "q");
  const tags = el("div", "q-top");
  tags.append(subjBadge(subject), el("span", "q-origin", it.origin), catChip(q.category, subject));
  card.append(tags);
  if (it.passage) card.append(passageNode(it.passage, true, lang));
  if (q.say) {
    const pb = el("button", "play-big"); pb.type = "button";
    pb.innerHTML = ICON_PLAY; pb.append(document.createTextNode("再聽一次"));
    pb.onclick = () => speak(q.say, pb);
    card.append(pb);
  }
  const line = el("div", "q-line");
  line.append(el("span", "num", `${z.i + 1}.`), stemNode(q.stem, subject));
  line.append((q.say ? null : speakBtn(() => (picked && q.completed) || q.stem, "朗讀題目", lang)) || el("span"));
  card.append(line);

  const finish = ok => { if (z.picks[z.i]) return; z.picks[z.i] = { ok }; recordAnswer(it, ok); render(); };
  if (free && q.options?.length) {
    const choices = el("ul", "options");
    for (const o of q.options) {
      const li = el("li", "opt");
      li.append(el("span", "lab", `(${o.label})`), textEl("span", "txt", o.text, subject));
      if (z.shown[z.i] && answerLabels(q).includes(norm(o.label))) { li.classList.add("is-answer"); li.append(el("span", "tag", "正解")); }
      choices.append(li);
    }

  }
  if (!free) {
    const ul = el("ul", "options");
    q.options.forEach(o => {
      const li = document.createElement("li");
      const b = el("button", "opt"); b.type = "button";
      b.append(el("span", "lab", `(${o.label})`), textEl("span", "txt", o.text, subject));
      if (picked) {
        if (norm(o.label) === norm(q.answer)) { b.classList.add("is-answer"); b.append(el("span", "tag", "正解")); }
        else if (norm(o.label) === norm(picked.label)) { b.classList.add("is-picked"); b.append(el("span", "tag", "你選的")); }
      }
      b.onclick = () => {
        if (z.picks[z.i]) return;
        const ok = norm(o.label) === norm(q.answer);
        z.picks[z.i] = { label: o.label, ok };

    // 計算、填寫題：先在紙上寫，再看答案自己對

    const b = el("button", "btn primary", subject === "math" ? "算好了，看答案" : "寫好了，看答案"); b.type = "button"; b.id = "quiz-reveal";
    b.onclick = () => { z.shown[z.i] = true; render(); };
    r.append(b, el("span", "kbd-hint", "先在紙上寫下答案"));
    card.append(r);
  } else {
    card.append(freeAnswerNode(q, subject));
    if (!picked) {
      const r = el("div", "self-row");
      const ok = el("button", "btn good", "我答對了"); ok.type = "button"; ok.onclick = () => finish(true);

      r.append(ok, ng, el("span", "kbd-hint", "和答案對對看"));
      card.append(r);
    }
  }
  if (picked || (free && z.shown[z.i])) {
    if (picked) card.append(el("div", "verdict " + (picked.ok ? "ok" : "bad"), picked.ok ? "答對了，好棒！" : free ? "沒關係，看解析弄懂它！" : `差一點點！正確答案是 (${norm(q.answer)})`));
    if (q.completed) card.append(completedNode(q.completed, lang));

    const last = z.i === z.items.length - 1;
    const nb = el("button", "btn primary", last ? "看成績" : "下一題"); nb.type = "button"; nb.id = "quiz-next";
    nb.onclick = () => nextQuestion();

function nextQuestion() {

    z.i++; render();
    const q = z.items[z.i].q;
    if (q.say) speak(q.say, document.querySelector(".play-big"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    z.finished = true;
    const right = z.picks.filter(p => p.ok).length;
    const hist = store.get("history", []);
    hist.unshift({ at: new Date().toISOString(), title: z.title, right, total: z.items.length });
    store.set("history", hist.slice(0, 30));

function renderQuizEnd(root) {
  const z = state.quiz;
  const right = z.picks.filter(p => p.ok).length, total = z.items.length;
  const head = el("div", "sheet-head");

document.addEventListener("keydown", e => {
  if (state.view !== "quiz" || !state.quiz || state.quiz.finished) return;
  if (e.target.closest?.("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const z = state.quiz, q = z.items[z.i].q;
  const k = e.key.toUpperCase();

    if (!isChoice(q)) return;

async function renderWrong(root) {
  await loadAllDetails();
  if (state.view !== "wrong") return;
  root.replaceChildren();
  // 測驗答錯的題目，加上週考卷上答錯的題目
  const entries = Object.entries(wrongBook).map(([id, w]) => ({ it: itemById(id), w })).filter(x => x.it);
  const ids = new Set(entries.map(x => x.it.id));
  for (const it of examWrongItems()) {
    if (ids.has(it.id)) continue;
    entries.push({ it, w: { n: 1, at: state.examDetail[it.folder]?.analysis?.analyzedAt || "", done: examMastered(it) } });
  }
  entries.sort((a, b) => (b.w.at || "").localeCompare(a.w.at || ""));
  const inSubj = x => (state.wbSubject === "all" || x.it.subject === state.wbSubject) && (state.wbSource === "all" || (x.it.source === "exam") === (state.wbSource === "exam"));
  const open = entries.filter(x => !x.w.done);
  const head = el("div", "sheet-head");
  const titles = el("div", "titles");
  const tl = el("div", "title-block");
  tl.append(el("h2", null, "錯題本"), el("div", "meta", `週考卷和測驗答錯的題目都在這裡（「學會了」只記在這台裝置）　共 ${entries.length} 題，已經學會 ${entries.length - open.length} 題`));
  titles.append(tl);
  if (entries.length) { const sc = el("div", "score"); sc.append(el("b", null, String(open.length)), el("small", null, "題還要練習")); titles.append(sc); }
  head.append(titles);
  const openShown = open.filter(inSubj);
  if (openShown.length) {
    const b = el("button", "btn primary", `用 ${Math.min(openShown.length, 20)} 題錯題做測驗`); b.type = "button";
    b.onclick = () => { state.view = "quiz"; store.set("view", "quiz"); startQuiz(shuffle(openShown.map(x => x.it)).slice(0, 20), "錯題複習"); };

  }
  root.append(head);
  const bar = el("div", "toolbar");
  const chips = el("div", "chips");
  chips.append(chip("還要練習", state.wbFilter === "open", () => { state.wbFilter = "open"; render(); }, open.filter(inSubj).length));
  chips.append(chip("全部", state.wbFilter === "all", () => { state.wbFilter = "all"; render(); }, entries.filter(inSubj).length));
  const subjects = [...new Set(entries.map(x => x.it.subject))];
  const sc = el("div", "chips");
  if (subjects.length > 1) {
    sc.append(chip("三科", state.wbSubject === "all", () => { state.wbSubject = "all"; render(); }));
    subjects.forEach(s => sc.append(chip(SUBJECTS[s].name, state.wbSubject === s, () => { state.wbSubject = s; render(); })));
  }
  const src = el("div", "chips");
  if (entries.some(x => x.it.source === "exam") && entries.some(x => x.it.source !== "exam")) {
    [["all", "全部來源"], ["exam", "週考錯題"], ["quiz", "測驗錯題"]].forEach(([v, label]) => src.append(chip(label, state.wbSource === v, () => { state.wbSource = v; render(); })));
  }
  bar.append(chips, sc, src);

  shown.forEach(({ it }) => list.append(questionCard(it, { showOrigin: true, showPassage: true, master: true })));
  root.append(list);
